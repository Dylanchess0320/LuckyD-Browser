<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0d0d10" />
    <meta
      name="description"
      content="Nexus — one app for every AI. Chat with GPT, Claude, Gemini, Grok, Llama and 300+ models with streaming, vision, voice and web search."
    />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Nexus</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #0d0d10;
      }
      #boot {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #boot .ring {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 3px solid #26262f;
        border-top-color: #7c6cff;
        animation: bootspin 0.9s linear infinite;
      }
      @keyframes bootspin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot"><div class="ring"></div></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
