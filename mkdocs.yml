# ── MkDocs Configuration ───────────────────────────────────────────────
# Build: mkdocs build
# Serve: mkdocs serve

site_name: LuckyD Code
site_description: AI-powered coding agent with multi-LLM support, memory graph, and VS Code integration
site_author: LuckyD
site_url: https://luckyd.github.io/coding-agent/
repo_name: luckyd/coding-agent
repo_url: https://github.com/luckyd/coding-agent
edit_uri: edit/main/docs/docs/
docs_dir: docs/docs

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github
    logo: material/robot

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/luckyd/coding-agent
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/luckyd-code/
  generator: false

copyright: Copyright &copy; 2026 LuckyD

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true
  - attr_list
  - md_in_html

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [".."]
          options:
            show_source: true
            show_root_heading: true
            docstring_style: google
  - git-revision-date-localized:
      enabled: !ENV [CI, false]
  - minify:
      minify_html: true

nav:
  - Home: index.md
  - Guide:
      - Getting Started: guide/getting-started.md
      - Installation: guide/installation.md
      - Configuration: guide/configuration.md

# NOTE: guide/usage.md, guide/tools.md, guide/memory.md, guide/providers.md,
# guide/docker.md, reference/api.md, reference/cli.md, and
# reference/configuration.md were referenced here but don't exist yet under
# docs/docs/ — removed from nav rather than left as build-breaking links.
# Add them back here once those pages are actually written.
#
# A "Development" section previously linked CONTRIBUTING.md, CHANGELOG.md,
# SECURITY.md, and CODE_OF_CONDUCT.md via ../ paths. MkDocs cannot include
# nav pages from outside docs_dir (docs/docs/) under any relative path —
# not a typo, a structural limitation — so those 404'd in strict mode.
# Those files intentionally stay at the repo root (GitHub surfaces them
# there automatically); repo_url above is how the docs site links out to
# them instead of duplicating their content inside docs_dir.
