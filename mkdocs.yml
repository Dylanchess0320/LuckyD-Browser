# ── MkDocs Configuration ───────────────────────────────────────────────
# Build: mkdocs build
# Serve: mkdocs serve

site_name: LuckyD Browser
site_description: The AI browser that runs your models — local, unlimited, offline. Chromium daily driver with an AI sidebar, coding-agent HQ, and real terminals in one window.
site_author: LuckyD
site_url: https://dylanchess0320.github.io/LuckyD-Browser/
repo_name: Dylanchess0320/LuckyD-Browser
repo_url: https://github.com/Dylanchess0320/LuckyD-Browser
docs_dir: docs/docs
edit_uri: edit/main/docs/docs/

theme:
  name: material
  palette:
    # Light mode — deep blue primary, gold accent
    - scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark mode — violet primary, gold accent
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github
    logo: material/web

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Dylanchess0320/LuckyD-Browser
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@LuckyDYoutube
  generator: false

extra_css:
  - assets/css/extra.css

copyright: Copyright &copy; 2026 LuckyD · MIT License

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true
  - attr_list
  - md_in_html

plugins:
  - search

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Features: features.md
  - AI & Agents: ai-agents.md
  - Terminal: terminal.md
  - Security: security.md
  - FAQ: faq.md
  - Changelog: changelog.md
  - Release Notes: release-notes.md
