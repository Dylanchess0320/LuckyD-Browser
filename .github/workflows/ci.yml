# ── LuckyD Code CI/CD Pipeline ─────────────────────────────────────────
# Runs on every push and PR to main branch.
# Stages: Lint → Type Check → Security → Test → Build → Publish

name: CI/CD

on:
  push:
    branches: [main, master, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.10"

jobs:
  # ── Quality Checks ──────────────────────────────────────────────────
  quality:
    name: "Code Quality"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Format Check (Black)
        run: black --check . --diff

      - name: Lint (Ruff)
        run: ruff check .

      - name: Type Check (Mypy)
        run: mypy tools llm memory project features core browser || true
        continue-on-error: true

  # ── Security Scan ───────────────────────────────────────────────────
  security:
    name: "Security Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [quality]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Dependency Scanning (Safety)
        run: safety scan -r requirements.txt --disable-telemetry || true
        continue-on-error: true

      - name: SAST (Bandit)
        run: bandit -r tools llm memory project features core browser --severity medium --quiet || true
        continue-on-error: true

  # ── Tests ───────────────────────────────────────────────────────────
  test:
    name: "Tests (Python ${{ matrix.python-version }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    needs: [quality]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run Tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: >
          pytest -v
          --cov=tools
          --cov=llm
          --cov=memory
          --cov=project
          --cov=core
          --cov=browser
          --cov-report=xml
          --cov-report=term
          -m "not llm and not slow"
          --timeout=300

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ── Build ───────────────────────────────────────────────────────────
  build:
    name: "Build Package"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test, security]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip build

      - name: Build Package
        run: python -m build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ── Publish to PyPI ─────────────────────────────────────────────────
  publish:
    name: "Publish to PyPI"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

  # ── Docker Build ────────────────────────────────────────────────────
  docker:
    name: "Docker Build"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Docker Hub credentials
        id: docker-creds
        run: |
          if [ -n "${{ secrets.DOCKER_USERNAME }}" ] && [ -n "${{ secrets.DOCKER_PASSWORD }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DOCKER_USERNAME/DOCKER_PASSWORD secrets not set - building image only (no push)."
          fi

      - name: Login to DockerHub
        if: steps.docker-creds.outputs.available == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build (and push when credentials exist)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ steps.docker-creds.outputs.available == 'true' }}
          tags: luckyd/coding-agent:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Status Check ────────────────────────────────────────────────────
  status:
    name: "CI Status"
    runs-on: ubuntu-latest
    needs: [quality, security, test]
    if: always()
    steps:
      - name: Check result
        run: |
          if [[ "${{ needs.test.result }}" == "failure" ]]; then
            echo "::error::Tests failed"
            exit 1
          fi
          echo "CI pipeline completed"
